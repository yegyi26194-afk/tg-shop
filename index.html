<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YNH Smart Life Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --card-bg: var(--tg-theme-secondary-bg-color, #232e3c);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --subtext-color: var(--tg-theme-hint-color, #7e8b99);
      --primary: var(--tg-theme-button-color, #2ea6ff);
      --primary-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 12px 12px 95px; }
    
    header { text-align: center; margin-bottom: 16px; padding-top: 6px; }
    h1 { font-size: 18px; font-weight: 700; }
    .store-sub { font-size: 13px; color: var(--subtext-color); margin-top: 4px; }
    
    .admin-bar { margin-top: 10px; display: inline-block; }
    .admin-link-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(46, 166, 255, 0.15); color: #2ea6ff; text-decoration: none; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(46, 166, 255, 0.3); }

    #loading { text-align: center; padding: 50px 20px; font-size: 14px; color: var(--subtext-color); }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    .card img { width: 100%; height: 130px; object-fit: cover; background-color: #313e4e; }
    .card-content { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; }
    .title { font-size: 13px; font-weight: 600; line-height: 1.35; min-height: 35px; margin-bottom: 6px; }
    .price { font-size: 14px; font-weight: 700; color: #2ea6ff; margin-bottom: 8px; }
    
    .color-select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #3c4b5d; font-size: 12px; margin-bottom: 8px; outline: none; background: #1c2733; color: #fff; }
    
    .qty-controls { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .qty-btn { width: 32px; height: 32px; border: none; border-radius: 8px; background: #314152; font-size: 16px; font-weight: bold; cursor: pointer; color: #fff; }
    .qty-count { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }

    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; z-index: 100; }
    .total-price { font-size: 16px; font-weight: 700; color: #2ea6ff; }
    .total-label { font-size: 12px; color: var(--subtext-color); }
